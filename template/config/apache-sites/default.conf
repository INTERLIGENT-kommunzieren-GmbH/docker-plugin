<VirtualHost *:80>
        ServerName ${BASE_DOMAIN}
        ServerAlias ${APACHE_ALIAS}

        LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
        CustomLog /dev/stdout proxy

        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html/public

        ProxyPreserveHost On
        ProxyPass /_mail/ http://mailpit:8025/_mail/ upgrade=websocket
        ProxyPassReverse /_mail/ http://mail:8025/_mail/

        TransferLog /var/log/apache/${BASE_DOMAIN}-access.log
        ErrorLog /var/log/apache/${BASE_DOMAIN}-error.log
</VirtualHost>
