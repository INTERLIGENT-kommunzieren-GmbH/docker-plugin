name: ${PROJECTNAME}
services:

  db:
    labels:
      com.interligent.dockerplugin.service: "db"
      com.interligent.dockerplugin.dir: "${PWD}"
      com.interligent.dockerplugin.project: "${PROJECTNAME}"
    command: --max-allowed-packet=16M --transaction-isolation=READ-COMMITTED --innodb-lock-wait-timeout=3600 --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_pw
      MARIADB_USER_FILE: /run/secrets/db_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_pw
      MARIADB_DATABASE_FILE: /run/secrets/db_name
    image: mariadb:lts
    networks:
      - "backend-tier"
    ports:
      - "${DB_HOST_PORT}:3306"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          memory: 512M
    stop_grace_period: 3600s
    secrets:
      - db_root_pw
      - db_user
      - db_pw
      - db_name
    volumes:
      - "./config/mariadb.cnf:/etc/mysql/conf.d/default.cnf"
      - "./volumes/db/data:/var/lib/mysql:cached"
      - "./volumes/db/init:/docker-entrypoint-initdb.d:cached"
      - "./logs/mariadb:/var/log/mysql"
      - "./volumes/db-share:/db-share"

  phpmyadmin:
    labels:
      com.interligent.dockerplugin.service: "phpmyadmin"
      com.interligent.dockerplugin.dir: "${PWD}"
      com.interligent.dockerplugin.project: "${PROJECTNAME}"
    depends_on:
      - db
    environment:
      PMA_ABSOLUTE_URI: https://${BASE_DOMAIN}/_phpmyadmin/
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
      VIRTUAL_HOST: ${BASE_DOMAIN}, www.${BASE_DOMAIN}
      VIRTUAL_PATH: /_phpmyadmin/
      VIRTUAL_DEST: /
      SELF_SIGNED_HOST: ${BASE_DOMAIN}, www.${BASE_DOMAIN}
    image: phpmyadmin
    networks:
      - "frontend-tier"
      - "backend-tier"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1"
          memory: 768M
        reservations:
          memory: 64M
    restart: always

  gotenberg:
    labels:
      com.interligent.dockerplugin.service: "gotenberg"
      com.interligent.dockerplugin.dir: "${PWD}"
      com.interligent.dockerplugin.project: "${PROJECTNAME}"
    image: gotenberg/gotenberg
    command: [ 'gotenberg', '--api-timeout', '300s', '--chromium-allow-file-access-from-files', '--chromium-disable-web-security', '--chromium-ignore-certificate-errors' ]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          memory: 64M
    restart: always
    networks:
      - "backend-tier"

  redis:
    image: valkey/valkey:8.1
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --dir /data
      --dbfilename dump.rdb
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      - "backend-tier"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - "./volumes/valkey/persist:/data"

  mail:
    labels:
      com.interligent.dockerplugin.service: "mail"
      com.interligent.dockerplugin.dir: "${PWD}"
      com.interligent.dockerplugin.project: "${PROJECTNAME}"
    environment:
      MP_WEBROOT: /_mail/
      VIRTUAL_HOST: ${BASE_DOMAIN}, www.${BASE_DOMAIN}
      VIRTUAL_PORT: 8025
      VIRTUAL_PATH: /_mail/
      VIRTUAL_DEST: /_mail/
      SELF_SIGNED_HOST: ${BASE_DOMAIN}, www.${BASE_DOMAIN}
    image: axllent/mailpit
    platform: linux/amd64
    networks:
      - "frontend-tier"
      - "backend-tier"
    deploy:
      restart_policy:
        condition: any

  php:
    labels:
      com.interligent.dockerplugin.service: "php"
      com.interligent.dockerplugin.dir: "${PWD}"
      com.interligent.dockerplugin.project: "${PROJECTNAME}"
    depends_on:
      - db
      - gotenberg
      - mail
      - phpmyadmin
    links:
      - db:db2
    environment:
      SSH_AUTH_PORT: host.docker.internal:2222
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      APACHE_ALIAS: www.${BASE_DOMAIN}
      APP_ENV: ${ENVIRONMENT}
      BASE_DOMAIN: ${BASE_DOMAIN}
      MAIL_DOMAIN: ${BASE_DOMAIN}
      MARIADB_USER_FILE: /run/secrets/db_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_pw
      MARIADB_DATABASE_FILE: /run/secrets/db_name
      PHP_GC_MAX_LIFETIME: ${PHP_GC_MAX_LIFETIME:-1440}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-256M}
      PHP_ERROR_REPORTING: ${PHP_ERROR_REPORTING:-22527}
      PROJECTNAME: ${PROJECTNAME}
      VIRTUAL_PORT: 80
      VIRTUAL_HOST: ${BASE_DOMAIN}, www.${BASE_DOMAIN}
      VIRTUAL_PATH: /
      SELF_SIGNED_HOST: ${BASE_DOMAIN}, www.${BASE_DOMAIN}
      XDEBUG_IP: ${XDEBUG_IP:-host.docker.internal}
      IDE_KEY: ${IDE_KEY:-PHPSTORM}
    image: fduarte42/docker-php:${PHP_VERSION}-debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - "frontend-tier"
      - "backend-tier"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "4"
          memory: 5256M
        reservations:
          memory: 256M
    secrets:
      - db_user
      - db_pw
      - db_name
    volumes:
      - "./config/composer.config.json:/var/www/.composer/config.json:cached"
      - "./config/crontab:/tmp/crontab"
      - "./config/htpasswd:/etc/apache2/.htpasswd:ro"
      - "./config/apache-sites:/etc/apache2/sites-enabled:ro"
      - "./config/php.ini:/usr/local/etc/php/conf.d/zzz-custom.ini:ro"
      - "./config/ssmtp.conf:/etc/ssmtp/ssmtp.conf:ro"
      - "./htdocs:/var/www/html"
      - "./logs/apache:/var/log/apache"
      - "./volumes/composer-cache:/var/www/.composer/cache"
      - "./volumes/db-share:/db-share"

  logrotate:
    labels:
      com.interligent.dockerplugin.service: "logrotate"
      com.interligent.dockerplugin.dir: "${PWD}"
      com.interligent.dockerplugin.project: "${PROJECTNAME}"
    image: ghcr.io/fduarte42/logrotate:latest
    environment:
      LOGROTATE_COPIES: 12
      LOGS_DIRECTORIES: "/logs"
      LOGROTATE_INTERVAL: monthly
      LOGROTATE_COMPRESSION: compress
      LOGROTATE_STATUSFILE: /logs/logrotate.status
      LOGROTATE_DATEFORMAT: "-%Y%m%d%H%i%s"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1"
          memory: 128M
        reservations:
          memory: 16M
    volumes:
      - "./logs:/logs"

secrets:
  db_root_pw:
    file: ./secrets/db_root_pw.txt
  db_user:
    file: ./secrets/db_user.txt
  db_pw:
    file: ./secrets/db_pw.txt
  db_name:
    file: ./secrets/db_name.txt

networks:
  frontend-tier:
    name: proxy
    external: true
  backend-tier:
    driver: bridge

