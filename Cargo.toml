[package]
name = "docker-control"
version = "2.4.9"
edition = "2024"
description = "a CLI tool to control ik docker stack"
homepage = "https://github.com/INTERLIGENT-kommunzieren-GmbH/docker-control"
repository = "git@github.com:INTERLIGENT-kommunzieren-GmbH/docker-control.git"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
git2 = { version = "0.21.0", features = ["ssh", "https"] }
inquire = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
chrono = "0.4.45"
include_dir = "0.7.4"
directories = "6.0.0"
libc = "0.2"
get_if_addrs = "0.5.3"
fs_extra = "1.3"
walkdir = "2.5"
bollard = "0.21.0"
daemonize = "0.5"
sha2 = "0.11.0"
rhai = "1.25.1"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dist]
inherits = "release"
lto = "thin"
